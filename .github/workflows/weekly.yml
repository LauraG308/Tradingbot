name: Woechentliches Update

on:
  schedule:
    # 07:00 UTC = 08:00/09:00 deutsche Zeit (je nach Sommer-/Winterzeit)
    - cron: '0 7 * * 1'
  workflow_dispatch: {}   # erlaubt manuellen Start per Knopfdruck in GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install yfinance pandas

      - name: Bot A ausfuehren
        run: python3 bot_a.py

      - name: Dashboard als Startseite bereitstellen
        run: cp dashboard.html index.html

      - name: Ergebnis zurueck ins Repository schreiben
        run: |
          git config user.name "Bot A"
          git config user.email "bot-a@users.noreply.github.com"
          git add index.html dashboard.html state.json history.json bot_a_report.log
          git commit -m "Woechentliches Update" || echo "Keine Aenderungen"
          git push
